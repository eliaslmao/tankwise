<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tankstellen Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-inhalt">
            <h1>⛽ Tankstellen Finder</h1>
            <p>Finde Tankstellen und vergleiche aktuelle Preise</p>
        </div>
    </header>

    <main>

        <div class="filter-bereich">
            <h2>Tankstellen</h2>

            <input
                type="text"
                id="suche"
                placeholder="Tankstelle suchen..."
            >
        </div>

        <!-- Hier werden die Tankstellen mit JavaScript eingefügt -->
        <div id="tankstellen-liste" class="tankstellen-liste"></div>

    </main>

    <footer>
        <p>Tankstellen App – Schulprojekt</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
