<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tankstellen Finder</title>

    <!-- Leaflet (Kartenbibliothek) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Leaflet-Erweiterung: fasst nahe Pinnadeln zu Gruppen zusammen -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="header-inhalt">
            <h1>⛽ Silas Tankstellen Finder</h1>
            <p>Finde Tankstellen und vergleiche aktuelle Preise</p>
        </div>
    </header>

    <main>

        <div class="filter-bereich">
            <h2>Tankstellen</h2>

            <input
                type="text"
                id="suche"
                placeholder="Name, Kette oder Adresse..."
            >
        </div>

        <p id="stand" class="stand"></p>

        <!-- Karte von Wien mit allen Tankstellen -->
        <div id="karte"></div>

        <!-- Hier werden die Tankstellen mit JavaScript eingefügt -->
        <div id="tankstellen-liste" class="tankstellen-liste"></div>

    </main>

    <footer>
        <p>Tankstellen App – Schulprojekt</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="script.js"></script>

</body>
</html>
